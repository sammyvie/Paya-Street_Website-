<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Paya Street | Contact Us</title>

  <!-- MAIN CSS -->
   <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="./css/Contact_page.css">

  <!-- ICON -->
  <link rel="icon" type="image/png" sizes="32x32" href="./img/colored_logo.png">

  <!-- GOOGLE FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- LEAFLET MAP -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- GEOCODER -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

</head>
<body>

<!-- ═══════════════ NAVBAR ═══════════════ -->
<nav class="navbar">

  <div class="logo">
    <a href="./index.html">
      <img src="./img/logo1.png" alt="Paya Street Logo">
    </a>
  </div>

  <ul class="nav-links">
    <li><a href="./Landing_page.html">Landing Page</a></li>
    <li><a href="./Feature_Page.html">Feature Page</a></li>
    <li><a href="./Product_Page.html">Product</a></li>
    <li><a href="./Contact_Page.html">Contact</a></li>
  </ul>

  <!-- HAMBURGER -->
  <button class="nav-toggle" aria-label="Toggle Navigation">
    <span></span>
    <span></span>
    <span></span>
  </button>

</nav>

<!-- ═══════════════ HERO SECTION ═══════════════ -->
<section class="hero-section">

  <div class="hero-box">
    <h1>Launch Your Message with Impact</h1>
    <p>
      Preview your emails and social posts exactly as your audience
      will see them
    </p>
  </div>

  <div class="hero-buttons-box">
    <button class="btn-primary"
      onclick="location.href='mailto:payastreetcoffee@gmail.com'">
      Email Your Idea
    </button>
    <button class="btn-secondary"
      onclick="location.href='./Social_Media_Page.html'">
      Share Online
    </button>
  </div>

</section>

<!-- ═══════════════ CONTACT SECTION ═══════════════ -->
<section class="contact-wrapper">

  <div class="contact-container">

    <!-- LEFT FORM -->
    <div class="contact-form">

      <h2>Contact Us</h2>
      <p>
        We'd love to hear from you! Please fill out the form below
        and our team will get back to you shortly.
      </p>

      <form action="mailto:payastreetcoffee@gmail.com"
            method="post"
            enctype="text/plain">

        <label for="name">Full Name</label>
        <input type="text" id="name" name="Name"
               placeholder="Enter your full name" required>

        <label for="phone">Contact Number</label>
        <input type="tel" id="phone" name="Phone"
               placeholder="Enter your contact number" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="Email"
               placeholder="Enter your email address" required>

        <label for="message">Your Message</label>
        <textarea id="message" name="Message" rows="4"
                  placeholder="Type your message here..."
                  required></textarea>

        <button type="submit" class="btn-send">
          Send Message
        </button>

      </form>
    </div>

    <!-- RIGHT IMAGE -->
    <div class="contact-image">
      <img src="./img/contact_photo.jpg"
           alt="Barista holding Oatside boxes">
    </div>

  </div>

</section>

<!-- ═══════════════ MAP ═══════════════ -->
<section class="map-section">
  <h2>Locate Us</h2>
  <div id="map"></div>
</section>

<!-- ═══════════════ FOOTER ═══════════════ -->
<section class="footer">
  <a href="./index.html">
    <img src="./img/Footer.png" alt="Footer Logo">
  </a>
</section>

<!-- MAP JS -->
<script src="./js/map.js"></script>

<!-- FIX: removed duplicate inline navbar script — script.js handles it -->
<script src="./js/script.js"></script>

</body>
</html>
